<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana Earner</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg:#08111d; --panel:#0d1b2a; --path:#26374a; --text:#eef5ff;
    --muted:#9fb0c5; --gold:#ffd34d; --silver:#d9e5ef; --danger:#ff6262;
    --accent:#71e6ff;
  }
  body {
    margin:0; min-height:100vh; background:
      radial-gradient(circle at 50% 10%, #183454 0, #08111d 50%, #04090f 100%);
    color:var(--text); font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .game {
    width:min(1000px,100%); background:rgba(13,27,42,.96);
    border:1px solid #29425d; border-radius:16px; overflow:hidden;
    box-shadow:0 25px 70px rgba(0,0,0,.55);
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid #29425d; gap:12px;
  }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  .subtitle { color:var(--muted); font-size:12px; margin-top:2px; }
  .scorebox { display:flex; gap:18px; text-align:right; }
  .scorebox strong { display:block; color:var(--gold); font-size:23px; }
  .scorebox span { color:var(--muted); font-size:11px; }
  #gameCanvas { display:block; width:100%; background:#091522; }
  .controls {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
    gap:9px; padding:13px; border-top:1px solid #29425d;
  }
  button {
    border:1px solid #3b5c7b; background:#13283d; color:var(--text);
    border-radius:8px; padding:9px 15px; cursor:pointer; font-weight:700;
  }
  button:hover { background:#1a3854; }
  button.primary { border-color:#62d8ee; color:#bdf5ff; }
  .help { color:var(--muted); font-size:12px; }
  .status { text-align:center; min-height:25px; color:var(--muted); font-size:13px; padding-bottom:12px; }
  @media(max-width:600px) {
    body { padding:0; }
    .game { border-radius:0; width:100%; }
    header { padding:11px 13px; }
    h1 { font-size:17px; }
    .scorebox { gap:10px; }
    .scorebox strong { font-size:19px; }
    .help { width:100%; text-align:center; }
  }
</style>
</head>
<body>
<div class="game">
  <header>
    <div>
      <h1>Mana Earner</h1>
      <div class="subtitle">Run. Collect gems. Earn mana.</div>
    </div>
    <div class="scorebox">
      <div><strong id="mana">0</strong><span>MANA</span></div>
      <div><strong id="distance">0</strong><span>DISTANCE</span></div>
      <div><strong id="best">0</strong><span>BEST</span></div>
    </div>
  </header>

  <canvas id="gameCanvas" width="960" height="480" aria-label="Mana Earner game"></canvas>

  <div class="controls">
    <button id="start" class="primary">Start</button>
    <button id="restart">Restart</button>
    <span class="help">Controls: ← → move &nbsp; | &nbsp; ↑ / Space jump &nbsp; | &nbsp; ↓ move down</span>
  </div>
  <div id="status" class="status">Press Start to begin your run.</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const manaEl = document.getElementById("mana");
const distanceEl = document.getElementById("distance");
const bestEl = document.getElementById("best");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const restartBtn = document.getElementById("restart");

const W = canvas.width, H = canvas.height;
const groundY = 380;

let best = Number(localStorage.getItem("manaEarnerBest") || 0);
bestEl.textContent = best;

let game = null;
let lastTime = 0;
let animationId = null;

function newGame() {
  return {
    running: false,
    over: false,
    won: false,
    mana: 0,
    distance: 0,
    speed: 280,
    spawnTimer: 0.8,
    obstacleTimer: 1.7,
    gems: [],
    obstacles: [],
    particles: [],
    player: {
      x: 170, y: groundY - 58, w: 36, h: 58,
      vy: 0, lane: 1, targetLane: 1, jumping: false
    }
  };
}

function reset() {
  game = newGame();
  statusEl.textContent = "Press Start to begin your run.";
  updateUI();
  draw();
}

function start() {
  if (!game || game.over) game = newGame();
  if (game.running) return;
  game.running = true;
  game.over = false;
  statusEl.textContent = "Collect gems and avoid the obstacles!";
  lastTime = performance.now();
  if (!animationId) animationId = requestAnimationFrame(loop);
}

function restart() {
  game = newGame();
  game.running = true;
  game.over = false;
  statusEl.textContent = "New run started.";
  lastTime = performance.now();
  if (!animationId) animationId = requestAnimationFrame(loop);
}

function endGame(message, won=false) {
  game.running = false;
  game.over = true;
  game.won = won;
  if (game.mana > best) {
    best = game.mana;
    localStorage.setItem("manaEarnerBest", String(best));
  }
  statusEl.textContent = message + " Press Restart to try again.";
  updateUI();
}

function updateUI() {
  manaEl.textContent = game.mana;
  distanceEl.textContent = Math.floor(game.distance);
  bestEl.textContent = best;
}

function laneY(lane) {
  return [groundY - 58, groundY - 58, groundY - 58][lane];
}

function moveLane(dir) {
  if (!game || !game.running) return;
  game.player.targetLane = Math.max(0, Math.min(2, game.player.targetLane + dir));
}

function jump() {
  if (!game || !game.running) return;
  if (!game.player.jumping) {
    game.player.vy = -690;
    game.player.jumping = true;
  }
}

function spawnGem() {
  const lane = Math.floor(Math.random() * 3);
  const gold = Math.random() < 0.28;
  game.gems.push({
    x: W + 35, y: groundY - 25 - lane * 70,
    r: gold ? 14 : 11, value: gold ? 2 : 1, gold, lane,
    bob: Math.random() * Math.PI * 2
  });
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const tall = Math.random() < 0.32;
  game.obstacles.push({
    x: W + 40, y: groundY - (tall ? 78 : 48) - lane * 70,
    w: tall ? 34 : 45, h: tall ? 78 : 48, lane
  });
}

function rectCircleCollision(rect, circle) {
  const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
  const dx = circle.x - closestX, dy = circle.y - closestY;
  return dx * dx + dy * dy < circle.r * circle.r;
}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

function playerRect() {
  const p = game.player;
  return {x:p.x, y:p.y, w:p.w, h:p.h};
}

function collect(gem) {
  game.mana += gem.value;
  for (let i=0;i<10;i++) {
    game.particles.push({
      x:gem.x, y:gem.y, vx:(Math.random()-.5)*140,
      vy:(Math.random()-.5)*140, life:.55, gold:gem.gold
    });
  }
}

function update(dt) {
  if (!game.running) return;

  game.distance += game.speed * dt / 10;
  game.speed = Math.min(520, 280 + game.distance * 0.35);

  const p = game.player;
  const desiredY = groundY - 58 - p.targetLane * 70;
  p.y += (desiredY - p.y) * Math.min(1, dt * 10);

  p.vy += 1800 * dt;
  p.y += p.vy * dt;

  const baseY = groundY - 58 - p.targetLane * 70;
  if (p.y >= baseY) {
    p.y = baseY;
    p.vy = 0;
    p.jumping = false;
  }

  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    spawnGem();
    game.spawnTimer = Math.max(.42, .78 - game.distance/1500) + Math.random()*.45;
  }

  game.obstacleTimer -= dt;
  if (game.obstacleTimer <= 0) {
    spawnObstacle();
    game.obstacleTimer = Math.max(.72, 1.35 - game.distance/1300) + Math.random()*.7;
  }

  for (const g of game.gems) {
    g.x -= game.speed * dt;
    g.bob += dt * 5;
    g.y += Math.sin(g.bob) * 12 * dt;
  }

  for (const o of game.obstacles) o.x -= game.speed * dt;

  const pr = playerRect();

  for (let i=game.gems.length-1;i>=0;i--) {
    if (rectCircleCollision(pr, game.gems[i])) {
      collect(game.gems[i]);
      game.gems.splice(i,1);
    } else if (game.gems[i].x < -40) {
      game.gems.splice(i,1);
    }
  }

  for (const o of game.obstacles) {
    if (rectsOverlap(pr,o)) {
      endGame("Run ended: you hit an obstacle.", false);
      return;
    }
  }

  game.obstacles = game.obstacles.filter(o => o.x > -80);

  for (let i=game.particles.length-1;i>=0;i--) {
    const q = game.particles[i];
    q.x += q.vx*dt;
    q.y += q.vy*dt;
    q.life -= dt;
    if (q.life <= 0) game.particles.splice(i,1);
  }

  // A simple target-based win condition keeps the run goal achievable.
  if (game.mana >= 25) {
    endGame("You win! You earned 25 mana and completed the run.", true);
  }

  updateUI();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#071321");
  grad.addColorStop(1,"#102237");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // stars
  ctx.fillStyle="rgba(255,255,255,.55)";
  for(let i=0;i<45;i++){
    const x=(i*173)%W, y=(i*71)%280;
    ctx.fillRect(x,y,2,2);
  }

  // distant mountains
  ctx.fillStyle="#101f31";
  ctx.beginPath();
  ctx.moveTo(0,groundY);
  for(let x=0;x<=W;x+=80) {
    ctx.lineTo(x,300-((x*37)%100));
  }
  ctx.lineTo(W,groundY);
  ctx.closePath();
  ctx.fill();

  // running path
  ctx.fillStyle="#26374a";
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.strokeStyle="#52667b";
  ctx.setLineDash([30,20]);

  for(let y=groundY+35;y<H;y+=42) {
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  ctx.setLineDash([]);

  // lane guides
  ctx.strokeStyle="rgba(137,171,200,.18)";
  for(let i=1;i<3;i++) {
    const y=groundY-i*70;
    ctx.beginPath();
    ctx.moveTo(0,y+15);
    ctx.lineTo(W,y+15);
    ctx.stroke();
  }
}

function drawPlayer() {
  const p=game.player;
  ctx.save();
  ctx.translate(p.x,p.y);

  // shadow
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(18,62,25,6,0,0,Math.PI*2);
  ctx.fill();

  // cape
  ctx.fillStyle="#4d72ff";
  ctx.beginPath();
  ctx.moveTo(8,20);
  ctx.lineTo(-8,51);
  ctx.lineTo(12,44);
  ctx.lineTo(23,55);
  ctx.lineTo(27,20);
  ctx.closePath();
  ctx.fill();

  // body
  ctx.fillStyle="#71e6ff";
  ctx.fillRect(9,20,20,28);

  ctx.fillStyle="#f0c9a8";
  ctx.beginPath();
  ctx.arc(19,12,10,0,Math.PI*2);
  ctx.fill();

  // legs
  ctx.strokeStyle="#d8e8f2";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(14,47);
  ctx.lineTo(8,59);
  ctx.moveTo(25,47);
  ctx.lineTo(31,59);
  ctx.stroke();

  ctx.restore();
}

function drawGem(g) {
  ctx.save();
  ctx.translate(g.x,g.y);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle=g.gold ? "#ffd34d" : "#d9e5ef";
  ctx.shadowColor=ctx.fillStyle;
  ctx.shadowBlur=16;
  ctx.fillRect(-g.r*.7,-g.r*.7,g.r*1.4,g.r*1.4);
  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  ctx.fillStyle="#d64d5a";
  ctx.shadowColor="rgba(255,70,80,.35)";
  ctx.shadowBlur=10;

  ctx.beginPath();
  ctx.moveTo(o.x,o.y+o.h);
  ctx.lineTo(o.x+o.w*.5,o.y);
  ctx.lineTo(o.x+o.w,o.y+o.h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#ff9a9a";
  ctx.fillRect(o.x+o.w*.45,o.y+o.h*.35,4,4);

  ctx.restore();
}

function draw() {
  drawBackground();

  if (!game) return;

  for(const o of game.obstacles) drawObstacle(o);
  for(const g of game.gems) drawGem(g);

  for(const q of game.particles) {
    ctx.globalAlpha=Math.max(0,q.life/.55);
    ctx.fillStyle=q.gold ? "#ffd34d" : "#d9e5ef";
    ctx.fillRect(q.x,q.y,4,4);
  }

  ctx.globalAlpha=1;
  drawPlayer();

  if (!game.running && !game.over) {
    overlay("MANA EARNER", "Press Start or Space to run");
  } else if (game.over) {
    overlay(
      game.won ? "RUN COMPLETE" : "RUN OVER",
      game.won ? "25 mana reached" : "Avoid obstacles next time"
    );
  }
}

function overlay(title, subtitle) {
  ctx.fillStyle="rgba(3,8,14,.58)";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign="center";

  ctx.fillStyle="#eef5ff";
  ctx.font="bold 42px system-ui";
  ctx.fillText(title,W/2,H/2-10);

  ctx.fillStyle="#b8c9d9";
  ctx.font="18px system-ui";
  ctx.fillText(subtitle,W/2,H/2+30);

  ctx.textAlign="left";
}

function loop(now) {
  animationId = requestAnimationFrame(loop);
  const dt = Math.min(.035, (now-lastTime)/1000 || 0);
  lastTime = now;
  update(dt);
  draw();
}

document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowLeft") {
    moveLane(-1);
  } else if (e.key === "ArrowRight") {
    moveLane(1);
  } else if (e.key === "ArrowUp" || e.key === " ") {
    if (!game.running) start();
    else jump();
  } else if (e.key === "ArrowDown") {
    moveLane(1);
  }
});

startBtn.addEventListener("click", start);
restartBtn.addEventListener("click", restart);

reset();
animationId = requestAnimationFrame(loop);
</script>
</body>
</html>
