<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b18"><title>Mana Earner</title>
<style>
:root{color-scheme:dark;--ink:#f4f5ff;--muted:#aab3d0;--cyan:#73e8f5;--gold:#ffd76b;--panel:#101a31}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#26366b 0,#0a1024 48%,#050914 100%);color:var(--ink);font:15px system-ui,sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(1100px,100%);border:1px solid #596b9b66;border-radius:22px;overflow:hidden;background:#0a1124eF;box-shadow:0 28px 90px #0009}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid #8294c433;flex-wrap:wrap}
h1{font-size:clamp(20px,4vw,29px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.stats{display:flex;gap:clamp(10px,3vw,28px);flex-wrap:wrap}.stat{text-align:center;min-width:55px}.stat b{display:block;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}.stat small{font-size:10px;color:var(--muted);letter-spacing:.12em}
#stage{display:block;width:100%;height:auto;aspect-ratio:1000/570;background:#091326;touch-action:pan-y}
footer{padding:14px 18px 17px;border-top:1px solid #8294c433;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #6378a7;background:#182647;color:var(--ink);border-radius:10px;padding:10px 17px;font-weight:700;cursor:pointer}button:hover{background:#263b68}button.primary{background:linear-gradient(110deg,#7ce9f3,#b7a2ff);color:#101329;border:0}.help{font-size:12px;color:var(--muted)}#message{color:#d9e2ff;font-size:12px;text-align:right;flex:1;min-width:180px}
@media(max-width:600px){body{padding:0}main{border-radius:0;min-height:100vh}header{padding:13px}.stats{width:100%;justify-content:space-between}.stat b{font-size:19px}footer{padding:12px}.help{width:100%;order:2}#message{text-align:left}}
</style>
</head>
<body><main>
<header><div><h1>Mana Earner</h1><div class="sub">Run the enchanted path · Gather mana · Survive the run</div></div>
<div class="stats">
<div class="stat"><b id="mana">0</b><small>MANA</small></div>
<div class="stat"><b id="best">0</b><small>PERSONAL BEST</small></div>
<div class="stat"><b id="lives">♥ ♥ ♥</b><small>LIVES</small></div>
<div class="stat"><b id="time">0:00</b><small>TIME</small></div>
<div class="stat"><b id="level">EASY</b><small>DIFFICULTY</small></div>
</div></header>
<canvas id="stage" width="1000" height="570" aria-label="Mana Earner three-lane fantasy running game"></canvas>
<footer><div class="actions"><button class="primary" id="start">Start</button><button id="pause">Pause</button><button id="restart">Restart</button></div><div class="help">← / → change lanes · Space jump · P pause · Touch: swipe left/right or tap to jump</div><div id="message">Press Start to begin your run.</div></footer>
</main>
<script>
"use strict";
const c=document.getElementById("stage"),x=c.getContext("2d"),$=id=>document.getElementById(id);
const W=1000,H=570,store="manaEarnerBest",laneX=[350,500,650];
let best=0;try{best=Number(localStorage.getItem(store))||0}catch{}$("best").textContent=best;
let g,raf=0,last=0,pressed=new Set();
function fresh(){return{mode:"ready",mana:0,lives:3,time:0,speed:270,spawn:1,crystal:7,objects:[],particles:[],player:{lane:1,visual:1,jump:0,hit:0,run:0},newBest:false,flash:0}}
function reset(){g=fresh();ui();draw();$("message").textContent="Press Start to begin your run."}
function begin(){if(g.mode==="over")g=fresh();if(g.mode==="paused")g.mode="playing";else if(g.mode==="ready")g.mode="playing";else return;$("message").textContent="Collect gems and avoid the stone steps.";last=performance.now();if(!raf)raf=requestAnimationFrame(loop);ui()}
function pause(){if(g.mode==="playing"){g.mode="paused";$("message").textContent="Paused · press P or Resume to continue";ui();draw() }else if(g.mode==="paused")begin()}
function restart(){g=fresh();begin()}
function finish(){g.mode="over";if(g.mana>best){best=g.mana;g.newBest=true;try{localStorage.setItem(store,String(best))}catch{} }$("message").textContent=g.newBest?"NEW PERSONAL BEST!":"Run complete · Try again to beat your record.";ui()}
function level(){return g.time<30?"EASY":g.time<60?"MEDIUM":g.time<90?"HARD":"VERY HARD"}
function ui(){$("mana").textContent=g.mana;$("best").textContent=best;$("lives").textContent="♥ ".repeat(g.lives).trim()||"—";$("time").textContent=Math.floor(g.time/60)+":"+String(Math.floor(g.time%60)).padStart(2,"0");$("level").textContent=level()}
function add(kind,lane,z=1){g.objects.push({kind,lane,z,hit:false,phase:Math.random()*6})}
function safeSpawn(){let lane=Math.floor(Math.random()*3);add(Math.random()<.58?"silver":"gold",lane);if(Math.random()<.24)add("silver",(lane+1+Math.floor(Math.random()*2))%3)}
function obstacleSpawn(){let lane=Math.floor(Math.random()*3);add("step",lane);if(Math.random()<.22&&g.time>35)add("silver",(lane+1)%3)}
function crystalSpawn(){add("crystal",Math.floor(Math.random()*3))}
function laneScreen(lane,z){const curve=Math.sin((1-z)*2.1)*70;return 500+(lane-1)*((150+z*100))+curve}
function roadY(z){return 150+z*430}
function update(dt){
if(g.mode!=="playing")return;g.time+=dt;g.speed=Math.min(520,270+g.time*2.05);g.player.visual+=(g.player.lane-g.player.visual)*Math.min(1,dt*13);g.player.jump=Math.max(0,g.player.jump-dt);g.player.hit=Math.max(0,g.player.hit-dt);g.player.run+=dt*13;g.flash=Math.max(0,g.flash-dt);
g.spawn-=dt;if(g.spawn<=0){safeSpawn();g.spawn=Math.max(.43,.92-g.time*.004)+Math.random()*.28}
g.crystal-=dt;if(g.crystal<=0){crystalSpawn();g.crystal=10+Math.random()*9}
if(Math.random()<dt*(.45+g.time*.008))obstacleSpawn();
for(let i=g.objects.length-1;i>=0;i--){let o=g.objects[i];o.z+=dt*(.33+g.speed/1300);if(o.z>1.06){g.objects.splice(i,1);continue}
if(o.z>.84&&!o.hit&&o.lane===Math.round(g.player.visual)){
if(o.kind==="silver"||o.kind==="gold"||o.kind==="crystal"){o.hit=true;if(o.kind==="silver"||o.kind==="gold"){g.mana+=o.kind==="gold"?2:1;burst(laneScreen(o.lane,o.z),roadY(o.z),o.kind==="gold"?"#ffd76b":"#dcecff")}else{if(g.lives<3)g.lives++;burst(laneScreen(o.lane,o.z),roadY(o.z),"#ffd76b")}g.objects.splice(i,1)}
else if(o.kind==="step"&&g.player.jump<=0&&g.player.hit<=0){o.hit=true;g.lives--;g.player.hit=.65;g.flash=.25;burst(laneScreen(o.lane,o.z),roadY(o.z),"#ff667e");if(g.lives<=0){finish();return}}
}}
for(let i=g.particles.length-1;i>=0;i--){let p=g.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)g.particles.splice(i,1)}
if(g.mana>best){/* record is committed at end of run */}ui()
}
function burst(px,py,color){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*130;g.particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55,color})}}
function path(){let grad=x.createLinearGradient(0,100,0,H);grad.addColorStop(0,"#26375d");grad.addColorStop(1,"#17223b");x.fillStyle=grad;x.beginPath();x.moveTo(350,150);x.bezierCurveTo(170,280,220,430,210,570);x.lineTo(790,570);x.bezierCurveTo(780,430,830,280,650,150);x.closePath();x.fill();
for(let i=0;i<4;i++){let t=i/3;x.strokeStyle=i===0||i===3?"#8fa8cf88":"#a8b8db55";x.lineWidth=i===0||i===3?4:2;x.beginPath();let bx=350+t*300;x.moveTo(bx,150);x.bezierCurveTo(170+t*660,280,220+t*560,430,210+t*580,570);x.stroke()}
for(let z=0;z<12;z++){let yy=165+z*37+(g.time*90%37);x.strokeStyle="#b8c9ee18";x.beginPath();x.moveTo(500-(yy-150)*.34,yy);x.lineTo(500+(yy-150)*.34,yy);x.stroke()}}
function background(){let gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#101d3c");gr.addColorStop(.55,"#172b43");gr.addColorStop(1,"#080f20");x.fillStyle=gr;x.fillRect(0,0,W,H);
for(let i=0;i<65;i++){let xx=(i*173)%W,yy=(i*83)%300;x.fillStyle=i%3?"#dce7ff88":"#ffe7a088";x.fillRect(xx,yy,2,2)}
for(let i=0;i<6;i++){let xx=i*205-40;x.fillStyle="#111d35";x.beginPath();x.moveTo(xx,190);x.lineTo(xx+80,80+(i%3)*35);x.lineTo(xx+160,190);x.fill()}
path()}
function gem(px,py,r,color){x.save();x.translate(px,py);x.rotate(Math.PI/4);x.shadowColor=color;x.shadowBlur=20;x.fillStyle=color;x.fillRect(-r,-r,r*2,r*2);x.fillStyle="#ffffff88";x.fillRect(-r/2,-r/2,r/2,r/2);x.restore()}
function drawObj(o){let z=o.z,px=laneScreen(o.lane,z),py=roadY(z),scale=.35+z*.8;x.save();x.translate(px,py);x.scale(scale,scale);
if(o.kind==="silver")gem(0,-17,10,"#dcecff");else if(o.kind==="gold")gem(0,-20,13,"#ffd45c");else if(o.kind==="crystal"){x.shadowColor="#ffdc70";x.shadowBlur=28;x.fillStyle="#ffda65";x.beginPath();x.moveTo(0,-35);x.lineTo(17,-12);x.lineTo(12,13);x.lineTo(0,24);x.lineTo(-12,13);x.lineTo(-17,-12);x.closePath();x.fill();x.strokeStyle="#fff4be";x.lineWidth=3;x.stroke()}else{x.fillStyle="#786d83";x.strokeStyle="#c3b5d0";x.lineWidth=3;x.shadowColor="#d2b6ff";x.shadowBlur=10;x.beginPath();x.moveTo(-35,0);x.lineTo(-35,-25);x.lineTo(-10,-25);x.lineTo(-10,-50);x.lineTo(35,-50);x.lineTo(35,0);x.closePath();x.fill();x.stroke();x.fillStyle="#a89ab0";x.fillRect(-31,-21,17,4);x.fillRect(-5,-46,34,4)}
x.restore()}
function player(){let p=g.player,px=laneScreen(p.visual,.98),py=roadY(.98)-(p.jump>0?Math.sin((.55-p.jump)/.55*Math.PI)*105:0);x.save();x.translate(px,py);x.scale(1,1);x.fillStyle="#0008";x.beginPath();x.ellipse(0,8,28,8,0,0,7);x.fill();if(p.hit>0)x.globalAlpha=.45+Math.sin(p.hit*35)*.4;
x.fillStyle="#725dff";x.beginPath();x.moveTo(-10,-57);x.lineTo(-30,-18);x.lineTo(-7,-29);x.lineTo(12,-12);x.lineTo(18,-58);x.fill();x.fillStyle="#65dff1";x.fillRect(-12,-61,25,36);x.fillStyle="#eac6a9";x.beginPath();x.arc(0,-73,13,0,7);x.fill();x.fillStyle="#18213c";x.fillRect(-10,-80,20,6);
x.strokeStyle="#d9e7ff";x.lineWidth=7;x.lineCap="round";let swing=Math.sin(p.run)*8;x.beginPath();x.moveTo(-6,-26);x.lineTo(-12+swing,-3);x.moveTo(7,-26);x.lineTo(13-swing,-3);x.stroke();x.restore()}
function overlay(title,sub){x.fillStyle="#030716b8";x.fillRect(0,0,W,H);x.textAlign="center";x.shadowColor="#9b8cff";x.shadowBlur=22;x.fillStyle="#f5f4ff";x.font="700 48px system-ui";x.fillText(title,500,245);x.shadowBlur=0;x.fillStyle="#d4def9";x.font="18px system-ui";x.fillText(sub,500,285);x.font="14px system-ui";if(g.mode==="over"){x.fillText("Final mana: "+g.mana+"    ·    Personal best: "+best,500,325);if(g.newBest){x.fillStyle="#ffdf83";x.font="bold 18px system-ui";x.fillText("NEW PERSONAL BEST!",500,365)}}else if(g.mode==="ready")x.fillText("← / → to switch lanes · SPACE to jump",500,325);else if(g.mode==="paused")x.fillText("Press P or Pause to resume",500,325);x.textAlign="left"}
function draw(){background();for(let o of [...g.objects].sort((a,b)=>a.z-b.z))drawObj(o);for(let p of g.particles){x.globalAlpha=Math.max(0,p.life/.55);x.fillStyle=p.color;x.fillRect(p.x,p.y,5,5)}x.globalAlpha=1;player();if(g.flash){x.fillStyle="#ff345522";x.fillRect(0,0,W,H)}if(g.mode==="ready")overlay("MANA EARNER","Collect silver and gold mana gems");if(g.mode==="paused")overlay("PAUSED","Your run is waiting");if(g.mode==="over")overlay("RUN OVER","The enchanted path claims another runner")}
function loop(now){raf=0;let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();if(g.mode==="playing")raf=requestAnimationFrame(loop)}
function request(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
function lane(d){if(g.mode!=="playing")return;g.player.lane=Math.max(0,Math.min(2,g.player.lane+d))}
function jump(){if(g.mode==="ready"){begin();return}if(g.mode==="playing"&&g.player.jump<=0)g.player.jump=.55}
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," ","ArrowUp"].includes(e.key))e.preventDefault();if(pressed.has(e.key))return;pressed.add(e.key);if(e.key==="ArrowLeft")lane(-1);if(e.key==="ArrowRight")lane(1);if(e.key===" "||e.key==="ArrowUp")jump();if(e.key.toLowerCase()==="p")pause()});
document.addEventListener("keyup",e=>pressed.delete(e.key));window.addEventListener("blur",()=>pressed.clear());
let touchX=null;c.addEventListener("touchstart",e=>{touchX=e.changedTouches[0].clientX},{passive:true});c.addEventListener("touchend",e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>25)lane(dx<0?-1:1);else jump();touchX=null},{passive:true});
$("start").onclick=begin;$("pause").onclick=pause;$("restart").onclick=restart;
reset();draw();
</script></body></html>
